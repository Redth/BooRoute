name: "Demo inline review"
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
  # roles: all # Roles processed as role check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      pr_number:
        description: Open pull request to demonstrate
        required: true
        type: number

permissions: {}

concurrency:
  cancel-in-progress: true
  group: demo-inline-review-${{ github.event.pull_request.number || inputs.pr_number }}

run-name: "Demo inline review"

