          {"create_report_incomplete_issue":{},"missing_data":{},"missing_tool":{},"noop":{"max":1,"report-as-issue":"false"},"publish-demo-review":{"description":"Publish validated demo feedback on the triggering PR only.","inputs":{"review":{"default":null,"description":"Validated revision and at most two demo feedback items as JSON.","required":true,"type":"string"}}},"report_incomplete":{}}
